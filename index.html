cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAREZMİ ODAK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: sans-serif; }
        .bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), url('./bg.jpg');
            background-size: cover; background-position: center; z-index: 1;
        }
        .main {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
        }
        .panel {
            background: rgba(0, 0, 0, 0.85); border: 2px solid #00f2ff;
            padding: 30px; border-radius: 40px; text-align: center;
            width: 90%; max-width: 420px; backdrop-filter: blur(15px);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.3);
        }
        h1 { font-size: 3.5rem; color: #00f2ff; text-shadow: 0 0 20px #00f2ff; margin-bottom: 5px; }
        #task { font-size: 1.2rem; color: #fff; margin: 15px 0; min-height: 3rem; font-weight: bold; text-transform: uppercase; display: flex; align-items: center; justify-content: center; }
        #timer { font-size: 6rem; font-weight: bold; color: #ff4444; margin: 5px 0; font-family: monospace; }
        .btn-main { background: #ff0000; color: #fff; border: none; padding: 18px 45px; border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.3rem; margin: 10px 0; }
        .m-zone { margin-top: 20px; border-top: 1px solid rgba(0,242,255,0.2); padding-top: 20px; }
        .btn-m { background: transparent; color: #fff; border: 1px solid #00f2ff; padding: 10px 20px; border-radius: 20px; margin: 5px; cursor: pointer; }
    </style>
</head>
<body onload="init()">
    <div class="bg"></div>
    <div class="main">
        <div class="panel">
            <h1>HAREZMİ</h1>
            <div id="task">ODAKLANMAYA HAZIR MISIN?</div>
            <div id="timer">00:00</div>
            <button class="btn-main" onclick="start()">YENİ GÖREV AL</button>
            <div class="m-zone">
                <p id="m-name" style="color:#00f2ff; margin-bottom:10px; font-weight:bold;">🎵 Müzik: Hazır</p>
                <button onclick="next()" class="btn-m">DEĞİŞTİR</button>
                <button onclick="stop()" class="btn-m" style="border-color:#ff4444;">KAPAT</button>
            </div>
        </div>
    </div>
    <audio id="p" loop></audio>
    <script>
        const tasks = [
            "Matematik: 20 Soru Çöz", "Kitap: 15 Sayfa Oku", "Yazılım: Yeni Fonksiyon Yaz", "İngilizce: 15 Kelime Ezberle",
            "Tarih: Bir Konu Özeti", "Fizik: 5 Formül Ezberle", "Kimya: Elementler Tekrar", "Biyoloji: Hücre Çiz",
            "Spor: 20 Şınav Çek", "Su İç: Büyük Bir Bardak", "Düzen: Masanı Toparla", "Yazılım: GitHub Commit Yap",
            "Harezmi: Algoritma Araştır", "Mantık: Bir Bilmece Çöz", "İngilizce: Metin Çevir", "Türkçe: Yazım Kuralları",
            "Coğrafya: Ülke Bul", "Resim: Bir Karalama Yap", "Teknoloji: Yapay Zeka Haberi", "Yazılım: CSS Grid Bak",
            "E-posta: Gereksizleri Sil", "Analiz: Hatalarını Yaz", "Motivasyon: Hedefini Belirle", "Hız: 1 Dakika Yazı",
            "Yazılım: Vercel Deploy Yap", "Matematik: Karekök Çalış", "Biyoloji: Bitki Yapısı", "Edebiyat: Yazar Hayatı",
            "Matematik: Yüzde Hesapla", "İngilizce: Şarkı Çevir", "Türkçe: Paragraf Çöz", "Fizik: Newton Yasaları"
        ];
        const songs = [
            {n:"Dinlendirici Piyano", s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3"},
            {n:"Sakin Yağmur Sesi", s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
            {n:"Derin Odaklanma", s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"},
            {n:"Huzurlu Doğa", s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"}
        ];
        let sec = 0, tid = null, sidx = 0;
        const player = document.getElementById('p');
        function init() { window.onclick = () => { if(!player.src){ player.src=songs[0].s; document.getElementById('m-name').innerText="🎵 "+songs[0].n; } player.play(); window.onclick=null; }; }
        function next(){ sidx=(sidx+1)%songs.length; player.src=songs[sidx].s; document.getElementById('m-name').innerText="🎵 "+songs[sidx].n; player.play(); }
        function stop(){ player.pause(); document.getElementById('m-name').innerText="🔇 Kapalı"; }
        function start(){
            if(tid) clearInterval(tid);
            document.getElementById('task').innerText = tasks[Math.floor(Math.random()*tasks.length)];
            sec = 25 * 60; // Anında 25 dakika başlar
            tid = setInterval(() => {
                if(sec > 0){ sec--; let m=Math.floor(sec/60), s=sec%60; document.getElementById('timer').innerText=(m<10?'0'+m:m)+":"+(s<10?'0'+s:s); }
            }, 1000);
        }
    </script>
</body>
</html>
EOF
git add .
git commit -m "Turkce muzik ve hizli gorev sistemi"
git push origin main --force
