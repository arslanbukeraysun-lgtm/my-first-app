cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAREZMİ ODAK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { width: 100%; height: 100%; overflow: hidden; background: #000; font-family: 'Segoe UI', sans-serif; }
        .background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.5)), url('./bg.jpg');
            background-size: cover; background-position: center; z-index: 1;
        }
        .ui-layer {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: white; text-align: center;
        }
        h1 { font-size: 4rem; font-weight: 900; color: #00f2ff; text-shadow: 0 0 25px rgba(0,242,255,0.8); margin-bottom: 10px; }
        #task { font-size: 1.5rem; font-weight: 600; min-height: 2.5rem; margin-bottom: 10px; text-shadow: 2px 2px 10px rgba(0,0,0,0.8); background: rgba(0,0,0,0.3); padding: 5px 20px; border-radius: 20px; }
        #timer { font-size: 7.5rem; font-weight: bold; color: #ff4444; text-shadow: 0 0 35px rgba(255,68,68,0.6); font-family: monospace; line-height: 1; }
        .btn-main { 
            background: #ff0000; color: white; border: none; padding: 20px 50px; 
            border-radius: 60px; font-weight: bold; cursor: pointer; font-size: 1.4rem;
            margin: 25px 0; box-shadow: 0 10px 25px rgba(0,0,0,0.5); transition: 0.2s;
        }
        .btn-main:active { transform: scale(0.9); }
        .music-box { 
            background: rgba(0,0,0,0.5); padding: 15px 25px; border-radius: 35px; 
            backdrop-filter: blur(8px); border: 1px solid rgba(255,255,255,0.1);
        }
        #m-info { color: #00f2ff; font-weight: bold; margin-bottom: 10px; font-size: 1rem; }
        .btn-s { background: transparent; color: white; border: 1px solid #00f2ff; padding: 8px 18px; border-radius: 20px; margin: 0 5px; cursor: pointer; font-size: 0.8rem; }
    </style>
</head>
<body onload="init()">
    <div class="background"></div>
    <div class="ui-layer">
        <h1>HAREZMİ</h1>
        <div id="task">HAZIR MISIN?</div>
        <div id="timer">00:00</div>
        <button class="btn-main" onclick="startTimer()">YENİ GÖREV AL</button>
        <div class="music-box">
            <p id="m-info">🎵 Müzik Hazır</p>
            <button class="btn-s" onclick="change()">DEĞİŞTİR</button>
            <button class="btn-s" onclick="off()" style="border-color:#ff4444;">KAPAT</button>
        </div>
    </div>
    <audio id="snd" loop></audio>
    <script>
        // Görevler ve onlara özel süreler (dakika cinsinden)
        const taskData = [
            {t: "Matematik Çöz", d: 40},
            {t: "İngilizce Çalış", d: 25},
            {t: "Su İç ve Esne", d: 2},
            {t: "Kitap Oku", d: 20},
            {t: "Kod Yaz", d: 45},
            {t: "Masanı Topla", d: 5},
            {t: "Kelime Ezberle", d: 15},
            {t: "Kısa Bir Mola", d: 10}
        ];
        const musicList = [
            {n:"Dinlendirici Piyano", s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3"},
            {n:"Sakin Yağmur", s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
            {n:"Derin Odaklanma", s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"}
        ];
        let timeLeft = 0, timerId = null, mIdx = 0;
        const player = document.getElementById('snd');
        function init() { window.onclick = () => { if(!player.src) { player.src = musicList[0].s; document.getElementById('m-info').innerText = "🎵 " + musicList[0].n; } player.play(); window.onclick = null; }; }
        function change() { mIdx = (mIdx + 1) % musicList.length; player.src = musicList[mIdx].s; document.getElementById('m-info').innerText = "🎵 " + musicList[mIdx].n; player.play(); }
        function off() { player.pause(); document.getElementById('m-info').innerText = "🔇 Kapalı"; }
        function startTimer() {
            if(timerId) clearInterval(timerId);
            const selected = taskData[Math.floor(Math.random()*taskData.length)];
            document.getElementById('task').innerText = selected.t;
            timeLeft = selected.d * 60;
            timerId = setInterval(() => {
                if(timeLeft > 0) {
                    timeLeft--;
                    let m = Math.floor(timeLeft/60), s = timeLeft%60;
                    document.getElementById('timer').innerText = (m<10?'0'+m:m)+":"+(s<10?'0'+s:s);
                } else {
                    clearInterval(timerId);
                    document.getElementById('task').innerText = "GÖREV TAMAM!";
                }
            }, 1000);
        }
    </script>
</body>
</html>
EOF
git add .
git commit -m "Goreve ozel sure sistemi"
git push origin main --force
