cat << 'EOF' > index.html
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HAREZMİ ODAK</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html { 
            width: 100%; height: 100%; overflow: hidden; 
            background: #000; font-family: 'Segoe UI', sans-serif; 
        }
        
        /* Arka plan fotoğrafını tam ekran ve pürüzsüz yapar */
        .bg-img {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), url('./bg.jpg');
            background-size: cover; background-position: center; z-index: 1;
        }

        /* İçeriği ekranın alt-orta kısmına, fotoğrafla birleşecek şekilde yerleştirir */
        .content-layer {
            position: relative; z-index: 10; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            padding-bottom: 50px; /* Paneli biraz aşağıya çeker */
        }

        /* Cam (Glassmorphism) efekti: Fotoğrafla bütünleşik görünüm */
        .glass-ui {
            background: rgba(0, 0, 0, 0.6); /* Daha şeffaf */
            padding: 30px 20px; border-radius: 50px; text-align: center;
            width: 90%; max-width: 400px; backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 242, 255, 0.3);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        h1 { font-size: 3rem; color: #00f2ff; text-shadow: 0 0 15px #00f2ff; margin-bottom: 5px; }
        #task { font-size: 1.1rem; color: #fff; margin: 10px 0; min-height: 2.5rem; font-weight: 600; }
        #timer { font-size: 5.5rem; font-weight: bold; color: #ff4444; margin: 5px 0; font-family: monospace; }
        
        .btn-start { 
            background: #ff0000; color: #fff; border: none; padding: 15px 40px; 
            border-radius: 50px; font-weight: bold; cursor: pointer; font-size: 1.2rem;
            box-shadow: 0 5px 15px rgba(255,0,0,0.3);
        }

        .music-ctrl { margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); }
        .btn-m { background: transparent; color: #fff; border: 1px solid #00f2ff; padding: 8px 18px; border-radius: 20px; margin: 5px; font-size: 0.8rem; }
    </style>
</head>
<body onload="init()">
    <div class="bg-img"></div>
    <div class="content-layer">
        <div class="glass-ui">
            <h1>HAREZMİ</h1>
            <div id="task">HAZIR MISIN?</div>
            <div id="timer">00:00</div>
            <button class="btn-start" onclick="start()">YENİ GÖREV AL</button>
            <div class="music-ctrl">
                <p id="m-txt" style="color:#00f2ff; font-size: 0.9rem; margin-bottom:10px;">🎵 Dinlendirici Müzik</p>
                <button onclick="next()" class="btn-m">DEĞİŞTİR</button>
                <button onclick="stop()" class="btn-m" style="border-color:#ff4444;">KAPAT</button>
            </div>
        </div>
    </div>
    <audio id="audio" loop></audio>
    <script>
        const tasks = ["Matematik Çöz", "Kitap Oku", "Kod Yaz", "Kelime Ezberle", "Özet Çıkar", "Spor Yap", "Su İç", "Algoritma Kur"];
        const tracks = [
            {n:"Piyano", s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3"},
            {n:"Yağmur", s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"},
            {n:"Odaklanma", s:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"}
        ];
        let sec = 0, tid = null, idx = 0;
        const player = document.getElementById('audio');

        function init() {
            window.onclick = () => {
                if(!player.src) { player.src=tracks[0].s; document.getElementById('m-txt').innerText="🎵 "+tracks[0].n; }
                player.play(); window.onclick=null;
            };
        }
        function next() { idx=(idx+1)%tracks.length; player.src=tracks[idx].s; document.getElementById('m-txt').innerText="🎵 "+tracks[idx].n; player.play(); }
        function stop() { player.pause(); document.getElementById('m-txt').innerText="🔇 Kapalı"; }
        function start() {
            if(tid) clearInterval(tid);
            document.getElementById('task').innerText = tasks[Math.floor(Math.random()*tasks.length)];
            sec = 25 * 60;
            tid = setInterval(() => {
                if(sec > 0){ sec--; let m=Math.floor(sec/60), s=sec%60; document.getElementById('timer').innerText=(m<10?'0'+m:m)+":"+(s<10?'0'+s:s); }
            }, 1000);
        }
    </script>
</body>
</html>
EOF
git add .
git commit -m "Fotograf ile bütünleşmiş şeffaf tasarım"
git push origin main --force
